name: release-ts-se-tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore "TS SE Tool.sln"

      - name: Build Release
        run: msbuild "TS SE Tool.sln" /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $pkg = "release-package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          # Copy the full build output (exe, dlls, native libs, updater, config)
          Copy-Item -Path "TS SE Tool/bin/Release/*" -Destination $pkg -Recurse -Force

          $zip = "TS-SE-Tool-$version.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TS SE Tool ${{ github.ref_name }}
          files: TS-SE-Tool-${{ github.ref_name }}.zip
          generate_release_notes: true