name: Diagnose Windows build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore and build
        shell: pwsh
        run: |
          nuget restore "TS SE Tool.sln" -NonInteractive
          msbuild "TS SE Tool.sln" /m /p:Configuration=Release /p:Platform="Any CPU" /p:Deterministic=true
      - name: Package
        shell: pwsh
        run: ./build/Prepare-Portable.ps1 -PackageVersion 1.61.2
      - name: Build installer and capture diagnostics
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $source = (Resolve-Path 'artifacts/portable').Path
          $output = Join-Path $PWD 'artifacts/setup'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DMyAppVersion=1.61.2" "/DSourceDir=$source" "/DOutputDir=$output" 'installer/TS-SE-Tool.iss' 2>&1 | Tee-Object -FilePath installer.log
          exit $LASTEXITCODE
      - name: Publish failure details
        if: steps.installer.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('installer.log', 'utf8').split(/\r?\n/);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Windows installer diagnostics\n\n\`\`\`text\n${lines.slice(-120).join('\n')}\n\`\`\``
            });
      - name: Fail job
        if: steps.installer.outcome == 'failure'
        shell: pwsh
        run: exit 1
