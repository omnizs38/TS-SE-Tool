name: Windows build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE: TS SE Tool.sln
  BUILD_CONFIGURATION: Release
  STABLE_VERSION: 1.62.1

jobs:
  build:
    name: Windows 2025 portable and setup
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-net10-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-net10-${{ runner.os }}-

      - name: Build and publish complete .NET 10 application
        shell: pwsh
        run: |
          dotnet publish 'TS SE Tool/TS SE Tool.csproj' -c Release -r win-x86 --self-contained true -o artifacts/publish -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw ".NET 10 application publish failed with exit code $LASTEXITCODE" }
          dotnet build 'tools/LegacySqlCeExport/LegacySqlCeExport.csproj' -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw "Legacy migration helper build failed with exit code $LASTEXITCODE" }

      - name: Run .NET 10 production-code regressions
        shell: pwsh
        run: |
          dotnet run --project 'tests/TS-SE-Tool.RegressionTests/TS-SE-Tool.RegressionTests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Windows updater/config regressions failed" }
          dotnet run --project 'tests/TS-SE-Tool.ModernRegressionTests/TS-SE-Tool.ModernRegressionTests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Shared regressions failed" }
          dotnet run --project 'tests/TS-SE-Tool.StorageTests/TS-SE-Tool.StorageTests.csproj' --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "SQLite/migration regressions failed" }

      - name: Determine package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/master') {
            $version = $env:STABLE_VERSION
          } else {
            $version = "$env:STABLE_VERSION-ci.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble portable package
        shell: pwsh
        run: ./build/Prepare-Portable.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Smoke-test packaged WinForms, x86 decoder, and real SQL CE migration
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'tsset-net10-smoke'
          Copy-Item 'artifacts/portable' $smoke -Recurse -Force
          $fixture = Join-Path $env:RUNNER_TEMP 'legacy-fixture.sdf'
          & "$smoke/migration/LegacySqlCeExport.exe" --create-fixture $fixture
          if ($LASTEXITCODE -ne 0) { throw "Could not create SQL CE migration fixture" }
          $exe = Join-Path $smoke 'TS SE Tool.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"' + $fixture + '"')) -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw "Packaged application smoke test timed out" }
          $result = Join-Path $smoke 'smoke-test-result.txt'
          if (Test-Path $result) { Get-Content $result }
          if ($process.ExitCode -ne 0) {
            $detail = if (Test-Path $result) { (Get-Content $result -Raw) } else { 'Application exited before writing its smoke report' }
            $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$escaped"
            throw "Packaged application smoke test failed"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          $source = (Resolve-Path 'artifacts/portable').Path
          $output = Join-Path $PWD 'artifacts/setup'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DMyAppVersion=$env:PACKAGE_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" 'installer/TS-SE-Tool.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem 'artifacts/TS-SE-Tool-*-portable.zip'
            Get-ChildItem 'artifacts/setup/*.exe'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          if ($lines.Count -ne 2) { throw "Expected two release files, found $($lines.Count)." }
          $lines | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts/SHA256SUMS.txt'

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-portable
          path: artifacts/TS-SE-Tool-*-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload setup package
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-setup
          path: artifacts/setup/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Select release tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$env:STABLE_VERSION"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          $statusCode = [int]$response.StatusCode

          if ($statusCode -eq 200) {
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $tag already exists; leaving it unchanged."
          } elseif ($statusCode -eq 404) {
            "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            throw "GitHub release lookup failed with HTTP $statusCode."
          }

      - name: Download portable package
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-portable
          path: release

      - name: Download setup package
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-setup
          path: release

      - name: Download checksums
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-checksums
          path: release

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TS SE Tool ${{ steps.release.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
