name: Windows build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE: TS SE Tool.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Windows 2025 portable and setup
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore current dependencies
        shell: pwsh
        run: nuget restore "$env:SOLUTION_FILE" -NonInteractive

      - name: Build release
        shell: pwsh
        run: >-
          msbuild "$env:SOLUTION_FILE"
          /m
          /p:Configuration=$env:BUILD_CONFIGURATION
          /p:Platform="Any CPU"
          /p:Deterministic=true

      - name: Determine package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "1.61.1-ci.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble portable package
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            ./build/Prepare-Portable.ps1 -PackageVersion $env:PACKAGE_VERSION
          } catch {
            ($_ | Format-List * -Force | Out-String) | Set-Content artifacts/package-error.txt -Encoding utf8
            Write-Error $_
            exit 1
          }

      - name: Build installer
        id: installer
        if: steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
            if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
            $source = (Resolve-Path 'artifacts/portable').Path
            $output = Join-Path $PWD 'artifacts/setup'
            New-Item -ItemType Directory -Force -Path $output | Out-Null
            & $iscc "/DMyAppVersion=$env:PACKAGE_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" 'installer/TS-SE-Tool.iss' 2>&1 | Tee-Object -FilePath artifacts/installer.log
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } catch {
            ($_ | Format-List * -Force | Out-String) | Add-Content artifacts/installer.log
            Write-Error $_
            exit 1
          }

      - name: Generate SHA-256 checksums
        id: checksums
        if: steps.installer.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem 'artifacts/TS-SE-Tool-*-portable.zip'
            Get-ChildItem 'artifacts/setup/*.exe'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          if ($lines.Count -ne 2) { throw "Expected two release files, found $($lines.Count)." }
          $lines | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts/SHA256SUMS.txt'

      - name: Prepare packaging diagnostics
        id: diagnostics
        if: always() && github.event_name == 'pull_request' && (steps.package.outcome == 'failure' || steps.installer.outcome == 'failure' || steps.checksums.outcome == 'failure')
        shell: pwsh
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
          CHECKSUM_OUTCOME: ${{ steps.checksums.outcome }}
        run: |
          $all = @("package=$env:PACKAGE_OUTCOME", "installer=$env:INSTALLER_OUTCOME", "checksums=$env:CHECKSUM_OUTCOME")
          foreach ($path in @('artifacts/package-error.txt', 'artifacts/installer.log')) {
            if (Test-Path $path) { $all += "--- $path ---"; $all += Get-Content $path | Select-Object -First 240 }
          }
          $text = $all -join "`n"
          if ($text.Length -gt 55000) { $text = $text.Substring(0, 55000) }
          $body = "<!-- tsset-packaging-diagnostics -->`n### Windows packaging diagnostics`n`n````text`n$text`n````"
          Set-Content artifacts/packaging-comment.md -Value $body -Encoding utf8

      - name: Report packaging diagnostics
        if: steps.diagnostics.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('artifacts/packaging-comment.md', 'utf8')
            });

      - name: Stop after failed packaging
        if: always() && (steps.package.outcome == 'failure' || steps.installer.outcome == 'failure' || steps.checksums.outcome == 'failure')
        shell: pwsh
        run: throw 'Packaging failed; see the diagnostics above.'

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-portable
          path: artifacts/TS-SE-Tool-*-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload setup package
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-setup
          path: artifacts/setup/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: TS-SE-Tool-${{ github.sha }}-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-portable
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-setup
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: TS-SE-Tool-${{ github.sha }}-checksums
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
